<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Ouz Coffee & Co.</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#221a16" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <div class="login-screen">
      <div class="login-card">
        <h1>Ouz Coffee & Co.</h1>
        <p class="sub">Admin Panel — sign in to manage your site</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="username" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <button class="btn btn-primary" type="submit" id="loginBtn">Sign In</button>
        </form>
      </div>
    </div>

    <!-- Firebase compat scripts: plain <script> tags, no "import" statements,
         so there is nothing for a network proxy to rewrite or mis-resolve. -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="/firebase-config.js"></script>

    <script>
      firebase.initializeApp(firebaseConfig);
      var auth = firebase.auth();

      // If already logged in, skip straight to the dashboard.
      auth.onAuthStateChanged(function (user) {
        if (user) window.location.href = "/dashboard.html";
      });

      var form = document.getElementById("loginForm");
      var errorMsg = document.getElementById("errorMsg");
      var loginBtn = document.getElementById("loginBtn");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        errorMsg.classList.remove("show");
        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        auth
          .signInWithEmailAndPassword(email, password)
          .then(function () {
            window.location.href = "/dashboard.html";
          })
          .catch(function (err) {
            errorMsg.textContent =
              "Couldn't sign in. Check your email and password and try again.";
            errorMsg.classList.add("show");
            loginBtn.disabled = false;
            loginBtn.textContent = "Sign In";
          });
      });
    </script>
  </body>
</html>
