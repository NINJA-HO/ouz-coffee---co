<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enquiries — Ouz Coffee & Co. Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#221a16" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <div class="wrap">
        <div class="brand">Ouz Coffee & Co. <span>Admin</span></div>
        <div class="who">
          <span id="whoEmail"></span>
          <button class="btn btn-ghost" id="logoutBtn" type="button">Log Out</button>
        </div>
      </div>
    </header>

    <div class="admin-shell">
      <aside class="admin-sidebar">
        <nav class="sidebar-nav">
          <a href="/dashboard.html" class="sidebar-link">Dashboard</a>
          <a href="/gallery.html" class="sidebar-link">Gallery</a>
          <a href="/coffee-gear.html" class="sidebar-link">Coffee Gear</a>
          <a href="/roastery.html" class="sidebar-link">Roastery</a>
          <a href="/green-beans.html" class="sidebar-link">Green Beans</a>
          <a href="/menu.html" class="sidebar-link">Menu</a>
          <a href="/inventory.html" class="sidebar-link">Inventory</a>
          <a href="/orders.html" class="sidebar-link">Orders</a>
          <a href="/customers.html" class="sidebar-link">Customers</a>
          <a href="/events.html" class="sidebar-link">Events</a>
          <a href="/training-enquiries.html" class="sidebar-link active">Enquiries</a>
          <a href="/tutee-students.html" class="sidebar-link">Tutee Students</a>
          <a href="/lessons.html" class="sidebar-link">Lessons</a>
          <a href="/settings.html" class="sidebar-link">Settings</a>
          <!-- Future sections get added here, e.g.:
          <a href="/services.html" class="sidebar-link">Services</a>
          -->
        </nav>
      </aside>

      <main class="admin-main">
        <div class="section-title">
          <div>
            <h2>Enquiries</h2>
            <p>Messages from the Visit page, the Barista Training "Ask About the Next Cohort" form, and the AI chatbot.</p>
          </div>
        </div>

        <div id="enquiriesList" class="orders-list"></div>
        <div class="empty-state" id="emptyState" style="display: none;">
          No enquiries yet.
        </div>
      </main>
    </div>

    <!-- Firebase compat scripts: plain <script> tags, no "import" statements. -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>

    <script>
      firebase.initializeApp(firebaseConfig);
      var auth = firebase.auth();
      var db = firebase.firestore();

      // ---- Auth guard: redirect to login if not signed in ----
      auth.onAuthStateChanged(function (user) {
        if (!user) {
          window.location.href = "/index.html";
        } else {
          document.getElementById("whoEmail").textContent = user.email;
          loadEnquiries();
        }
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        auth.signOut().then(function () {
          window.location.href = "/index.html";
        });
      });

      function formatDate(timestamp) {
        if (!timestamp || !timestamp.toDate) return "";
        var d = timestamp.toDate();
        return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      // ---- Load & render enquiries (newest first) ----
      function loadEnquiries() {
        var list = document.getElementById("enquiriesList");
        var emptyState = document.getElementById("emptyState");
        list.innerHTML = "";

        db.collection("trainingEnquiries")
          .orderBy("createdAt", "desc")
          .get()
          .then(function (snapshot) {
            if (snapshot.empty) {
              emptyState.style.display = "block";
              return;
            }
            emptyState.style.display = "none";

            snapshot.forEach(function (docSnap) {
              var data = docSnap.data();
              var row = document.createElement("div");
              var sourceClass =
                data.source === "visit"
                  ? "enquiry-visit"
                  : data.source === "chatbot"
                  ? "enquiry-chatbot"
                  : "enquiry-training";
              row.className = "order-row enquiry-row " + sourceClass;
              var sourceLabel =
                data.source === "visit"
                  ? "Visit Page Enquiry"
                  : data.source === "chatbot"
                  ? "AI Chatbot Enquiry"
                  : "Training Page Enquiry";
              row.innerHTML =
                '<div class="order-row-product">' +
                '<div class="order-row-noimg"></div>' +
                "<div>" +
                '<div class="order-row-pname">' + (data.interestedIn || "(no preference)") + "</div>" +
                '<div class="order-row-pprice source-tag">' + sourceLabel + "</div>" +
                "</div>" +
                "</div>" +
                '<div class="order-row-customer">' +
                '<div class="order-row-label">Name</div>' +
                '<div>' + (data.fullName || "") + "</div>" +
                '<div class="order-row-label">Contact Number</div>' +
                '<div><a href="tel:' + (data.contactNumber || "") + '">' + (data.contactNumber || "") + "</a></div>" +
                (data.message
                  ? '<div class="order-row-label">Message</div><div>' + data.message + "</div>"
                  : "") +
                "</div>" +
                '<div class="order-row-meta">' +
                '<div class="order-row-date">' + formatDate(data.createdAt) + "</div>" +
                '<button class="btn btn-danger" data-id="' + docSnap.id + '">Delete</button>' +
                "</div>";

              row.querySelector(".btn-danger").addEventListener("click", function () {
                handleDelete(docSnap.id);
              });

              list.appendChild(row);
            });
          });
      }

      function handleDelete(id) {
        if (!confirm("Delete this enquiry?")) return;
        db.collection("trainingEnquiries")
          .doc(id)
          .delete()
          .then(function () {
            loadEnquiries();
          })
          .catch(function (err) {
            alert("Couldn't delete this enquiry. Please try again.");
            console.error(err);
          });
      }
    </script>
  </body>
</html>
